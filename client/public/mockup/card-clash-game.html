<style>
:root {
  --background: #efe4bd;
  --foreground: #183f3b;
  --card: #f7edc9;
  --card-foreground: #183f3b;
  --accent: #d5a94b;
  --border: #b89a54;
  --muted-foreground: #536c5c;
  --primary: #36745a;
  --font-size-base: 16px;
  --font-sans: system-ui, sans-serif;
  --viz-series-1: #bd5a48;
  --viz-series-2: #36745a;
}

html, body {
  margin: 0;
  min-width: 100%;
  min-height: 100%;
  overflow-x: hidden;
  background: #efe4bd;
}

#card-clash-real-game {
  --cc-you: var(--viz-series-2);
  --cc-them: var(--viz-series-1);
  --cc-gold: color-mix(in srgb, var(--foreground) 58%, var(--accent));
  --cc-felt: color-mix(in srgb, var(--card) 20%, var(--background));
  --cc-ink: var(--card-foreground);
  --cc-paper: color-mix(in srgb, var(--card) 86%, var(--accent));
  width: 100%;
  color: var(--foreground);
}

#card-clash-real-game * {
  box-sizing: border-box;
}

#card-clash-real-game button {
  font: inherit;
}

#card-clash-real-game .cc-board {
  position: relative;
  isolation: isolate;
  color-scheme: only light;
  forced-color-adjust: none;
  display: grid;
  grid-template-rows: minmax(138px, 1fr) auto minmax(132px, 1fr) auto 224px;
  gap: 8px;
  width: 100%;
  max-width: 430px;
  min-height: clamp(650px, 190vw, 820px);
  margin-inline: auto;
  padding: 12px;
  overflow: hidden;
  background: transparent;
  border-radius: 18px;
  background-image: none;
}

/* The mockup mounts this fragment as the battle surface itself. Keep the
   standalone board from looking like a card inside the host scene. */
#card-clash-real-game .cc-board {
  max-width: none;
  min-height: 100vh;
  min-height: 100dvh;
  border-radius: 0;
}

#card-clash-real-game .cc-table-art {
  position: absolute;
  z-index: -2;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
}

#card-clash-real-game .cc-board::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0;
  background:
    radial-gradient(circle at 15% 18%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 28%),
    radial-gradient(circle at 82% 74%, color-mix(in srgb, var(--primary) 12%, transparent), transparent 32%);
  pointer-events: none;
}

#card-clash-real-game .cc-board img {
  color-scheme: only light;
  forced-color-adjust: none;
}

#card-clash-real-game .cc-seat {
  display: grid;
  grid-template-columns: 58px minmax(88px, 1fr) 58px;
  gap: 8px;
  align-items: center;
  min-width: 0;
}

#card-clash-real-game .cc-them .cc-piles {
  grid-column: 1;
}

#card-clash-real-game .cc-them .cc-stage {
  grid-column: 2;
}

#card-clash-real-game .cc-them .cc-leader {
  grid-column: 3;
}

#card-clash-real-game .cc-you .cc-leader {
  grid-column: 1;
}

#card-clash-real-game .cc-you .cc-stage {
  grid-column: 2;
}

#card-clash-real-game .cc-you .cc-piles {
  grid-column: 3;
}

#card-clash-real-game .cc-piles {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

#card-clash-real-game .cc-you .cc-piles {
  flex-direction: column-reverse;
}

#card-clash-real-game .cc-deck,
#card-clash-real-game .cc-discard {
  position: relative;
  width: 38px;
  aspect-ratio: 8 / 11;
}

#card-clash-real-game .cc-leaf,
#card-clash-real-game .cc-discard-leaf {
  position: absolute;
  inset: 0;
  border: 2px solid color-mix(in srgb, var(--cc-gold) 78%, var(--foreground));
  border-radius: 7px;
  background:
    radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--accent) 40%, transparent), transparent 56%),
    color-mix(in srgb, var(--background) 62%, var(--accent));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cc-gold) 35%, transparent);
  transform: translate(calc(var(--i) * -1px), calc(var(--i) * -2px));
}

#card-clash-real-game .cc-leaf::after {
  content: "";
  position: absolute;
  width: 14px;
  aspect-ratio: 1;
  left: 50%;
  top: 50%;
  border: 1px solid color-mix(in srgb, var(--cc-gold) 68%, var(--foreground));
  transform: translate(-50%, -50%) rotate(45deg);
}

#card-clash-real-game .cc-discard {
  width: 25px;
  opacity: .48;
}

#card-clash-real-game .cc-discard-leaf {
  border-color: color-mix(in srgb, var(--muted-foreground) 55%, transparent);
  background: color-mix(in srgb, var(--muted) 72%, transparent);
  transform: translate(calc(var(--i) * 1px), calc(var(--i) * -1px)) rotate(-7deg);
}

#card-clash-real-game .cc-them .cc-discard-leaf {
  transform: translate(calc(var(--i) * -1px), calc(var(--i) * -1px)) rotate(7deg);
}

#card-clash-real-game .cc-discard-leaf::before,
#card-clash-real-game .cc-discard-leaf::after {
  content: "";
  position: absolute;
  width: 1px;
  height: 72%;
  left: 50%;
  top: 14%;
  background: color-mix(in srgb, var(--muted-foreground) 58%, transparent);
  transform: rotate(35deg);
}

#card-clash-real-game .cc-discard-leaf::after {
  transform: rotate(-35deg);
}

#card-clash-real-game .cc-empty-discard {
  opacity: .2;
}

#card-clash-real-game .cc-count {
  position: absolute;
  z-index: 5;
  right: -7px;
  bottom: -5px;
  display: grid;
  place-items: center;
  min-width: 20px;
  height: 20px;
  padding-inline: 4px;
  border: 1px solid color-mix(in srgb, var(--cc-paper) 82%, var(--foreground));
  border-radius: 999px;
  color: var(--foreground);
  background: color-mix(in srgb, var(--background) 62%, var(--accent));
  font-size: calc(var(--font-size-base) * .7);
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}

#card-clash-real-game .cc-stage {
  display: grid;
  place-items: center;
  min-width: 0;
}

#card-clash-real-game .cc-stage-card,
#card-clash-real-game .cc-card-back,
#card-clash-real-game .cc-drop {
  position: relative;
  width: 92px;
  aspect-ratio: 8 / 11;
  overflow: hidden;
  border: 2px solid color-mix(in srgb, var(--cc-them) 70%, var(--foreground));
  border-radius: 10px;
  background: color-mix(in srgb, var(--card) 74%, var(--accent));
  box-shadow: 0 7px 16px color-mix(in srgb, var(--foreground) 24%, transparent);
}

#card-clash-real-game .cc-you .cc-stage-card {
  width: 102px;
  border-color: color-mix(in srgb, var(--cc-you) 72%, var(--foreground));
}

#card-clash-real-game .cc-stage-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#card-clash-real-game .cc-stage-shelf {
  position: absolute;
  inset-inline: 3px;
  bottom: 3px;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 3px;
  padding: 3px 4px;
  color: var(--cc-ink);

#card-clash-real-game .cc-stage-stats {
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

#card-clash-real-game .cc-card-back {
  background:
    radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--accent) 38%, transparent), transparent 56%),
    color-mix(in srgb, var(--background) 60%, var(--accent));
  border-color: color-mix(in srgb, var(--cc-them) 66%, var(--foreground));
  transform: perspective(240px) rotateX(7deg);
  box-shadow:
    inset 0 0 0 2px color-mix(in srgb, var(--cc-gold) 30%, transparent),
    0 7px 16px color-mix(in srgb, var(--foreground) 22%, transparent);
}

#card-clash-real-game .cc-card-back::after,
#card-clash-real-game .cc-drop::after {
  content: "";
  position: absolute;
  width: 31%;
  aspect-ratio: 1;
  left: 50%;
  top: 50%;
  border: 2px solid color-mix(in srgb, var(--cc-gold) 62%, var(--foreground));
  transform: translate(-50%, -50%) rotate(45deg);
}

#card-clash-real-game .cc-drop {
  width: 64px;
  border-style: dashed;
  border-color: color-mix(in srgb, var(--cc-gold) 64%, var(--foreground));
  background: color-mix(in srgb, var(--background) 30%, transparent);
  box-shadow: inset 0 0 18px color-mix(in srgb, var(--cc-gold) 12%, transparent);
  transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
}

#card-clash-real-game .cc-drop::after {
  opacity: .45;
}

#card-clash-real-game .cc-drop.cc-ready {
  animation: cc-ready 2.4s ease-in-out infinite;
}

#card-clash-real-game .cc-drop.cc-drag-over {
  border-style: solid;
  border-color: color-mix(in srgb, var(--cc-gold) 78%, var(--foreground));
  box-shadow:
    0 0 0 3px color-mix(in srgb, var(--cc-gold) 24%, transparent),
    0 0 24px color-mix(in srgb, var(--cc-gold) 54%, transparent);
  transform: scale(1.04);
}

#card-clash-real-game .cc-leader {
  position: relative;
  width: 49px;
  aspect-ratio: 8 / 11;
  justify-self: center;
  padding: 0;
  overflow: visible;
  border: 2px solid color-mix(in srgb, var(--cc-you) 72%, var(--foreground));
  border-radius: 9px;
  color: var(--cc-ink);
  background: var(--cc-paper);
  box-shadow: 0 5px 12px color-mix(in srgb, var(--foreground) 22%, transparent);
  cursor: help;
}

#card-clash-real-game .cc-them .cc-leader {
  border-color: color-mix(in srgb, var(--cc-them) 72%, var(--foreground));
  transform: translateY(4px);
}

#card-clash-real-game .cc-you .cc-leader {
  transform: translateY(-4px);
}

#card-clash-real-game .cc-leader img {
  position: absolute;
  inset: 2px 2px 13px;
  width: calc(100% - 4px);
  height: calc(100% - 15px);
  object-fit: cover;
  object-position: 50% 33%;
  border-radius: 5px 5px 1px 1px;
}

#card-clash-real-game .cc-leader-name {
  position: absolute;
  inset-inline: 1px;
  bottom: 1px;
  height: 12px;
  display: grid;
  place-items: center;
  overflow: hidden;
  font-family: Georgia, "Times New Roman", serif;
  font-size: calc(var(--font-size-base) * .46);
  font-weight: 500;
  text-transform: uppercase;
}

#card-clash-real-game .cc-leader-help {
  position: absolute;
  right: 2px;
  bottom: 1px;
  color: var(--muted-foreground);
  font-size: calc(var(--font-size-base) * .5);
}

#card-clash-real-game .cc-charge {
  position: absolute;
  z-index: 3;
  right: -8px;
  top: -8px;
  display: flex;
  align-items: center;
  gap: 2px;
  min-width: 24px;
  height: 18px;
  padding-inline: 4px;
  border: 1px solid color-mix(in srgb, var(--cc-paper) 82%, var(--foreground));
  border-radius: 999px;
  color: var(--foreground);
  background: color-mix(in srgb, var(--background) 58%, var(--accent));
  font-size: calc(var(--font-size-base) * .62);
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}

#card-clash-real-game .cc-charge::before {
  content: "";
  width: 6px;
  aspect-ratio: 1;
  border: 1px solid currentColor;
  transform: rotate(45deg);
}

#card-clash-real-game .cc-leader.cc-spent {
  filter: saturate(.56);
  opacity: .82;
}

#card-clash-real-game .cc-leader-note {
  position: absolute;
  z-index: 20;
  width: min(210px, 68vw);
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: 0 8px 24px color-mix(in srgb, var(--foreground) 20%, transparent);
  font-size: calc(var(--font-size-base) * .78);
  font-weight: 400;
}

#card-clash-real-game .cc-them .cc-leader-note {
  top: 86px;
  right: 4px;
}

#card-clash-real-game .cc-you .cc-leader-note {
  left: 4px;
  bottom: 90px;
}

#card-clash-real-game .cc-tug {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) 28px;
  gap: 6px;
  align-items: center;
  width: min(100%, 350px);
  margin-inline: auto;
  padding: 5px 7px;
  border: 1px solid color-mix(in srgb, var(--border) 72%, transparent);
  border-radius: 999px;
  background: color-mix(in srgb, var(--background) 56%, transparent);
  backdrop-filter: blur(4px);
}

#card-clash-real-game .cc-score {
  display: grid;
  place-items: center;
  height: 20px;
  border-radius: 999px;
  color: var(--foreground);
  background: color-mix(in srgb, var(--cc-you) 26%, transparent);
  font-size: calc(var(--font-size-base) * .78);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

#card-clash-real-game .cc-score.cc-opponent {
  background: color-mix(in srgb, var(--cc-them) 26%, transparent);
}

#card-clash-real-game .cc-track {
  position: relative;
  display: flex;
  height: 16px;
  overflow: visible;
  border: 2px solid color-mix(in srgb, var(--cc-paper) 78%, var(--foreground));
  border-radius: 999px;
  background: var(--muted);
}

#card-clash-real-game .cc-fill-you,
#card-clash-real-game .cc-fill-them {
  height: 100%;
  transition: width 320ms ease;
}

#card-clash-real-game .cc-fill-you {
  border-radius: 999px 0 0 999px;
  background: var(--cc-you);
}

#card-clash-real-game .cc-fill-them {
  border-radius: 0 999px 999px 0;
  background: var(--cc-them);
}

#card-clash-real-game .cc-knot {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 19px;
  aspect-ratio: 1;
  border: 2px solid color-mix(in srgb, var(--cc-paper) 80%, var(--foreground));
  border-radius: 4px;
  background: color-mix(in srgb, var(--background) 64%, var(--accent));
  transform: translate(-50%, -50%) rotate(45deg);
  transition: left 320ms ease;
}

#card-clash-real-game .cc-log {
  align-self: center;
  justify-self: start;
  max-width: 82%;
  min-height: 30px;
  padding: 5px 10px;
  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--border) 72%, transparent);
  border-radius: 12px;
  color: var(--foreground);
  background: color-mix(in srgb, var(--background) 60%, transparent);
  backdrop-filter: blur(4px);
  font-family: Georgia, "Times New Roman", serif;
  font-size: calc(var(--font-size-base) * .78);
  font-style: italic;
  font-weight: 400;
  white-space: nowrap;
  text-overflow: ellipsis;
}

#card-clash-real-game .cc-hand {
  position: relative;
  display: flex;
  align-items: end;
  justify-content: center;
  min-width: 0;
  min-height: 218px;
  padding: 0 4px 2px;
}

#card-clash-real-game .cc-unit-card {
  --cc-tilt: 0deg;
  position: relative;
  width: min(43vw, 154px);
  aspect-ratio: 8 / 11;
  flex: 0 0 auto;
  margin-inline: -7px;
  padding: 0;
  overflow: hidden;
  border: 3px solid color-mix(in srgb, var(--cc-gold) 72%, var(--foreground));
  border-radius: 15px;
  color: var(--cc-ink);
  background: var(--cc-paper);
  box-shadow:
    inset 0 0 0 1px color-mix(in srgb, var(--cc-paper) 82%, var(--foreground)),
    0 12px 24px color-mix(in srgb, var(--foreground) 30%, transparent);
  transform: translateY(var(--cc-drop-y, 0)) rotate(var(--cc-tilt));
  transform-origin: 50% 92%;
  transition: transform 170ms ease, border-color 170ms ease, box-shadow 170ms ease;
  touch-action: none;

  };

  ];

  var enemyOrder = [
    "Soldier", "Brute", "Guardian", "Wraith", "Duelist",

  ];

  var uid = 0;
  var game;
  var leaderOpen = null;
  var playerLeader = "second_wind";
  var battleDifficulty = "steady";

  function unit(name) {
    var spec = catalog[name];
    uid += 1;
    return {
      uid: uid,
      name: name,
      basePower: spec.power,
      baseStamina: spec.stamina,
      power: spec.power,
      stamina: spec.stamina,
      ability: spec.ability,
      spent: false,
      stolen: null,
      stolenSpent: false,
      fresh: false
    };
  }

  function side(order, leader) {
    return {
      deck: order.map(unit),
      hand: [],
      active: null,
      discard: [],
      firstUnit: true,
      pendingPower: 0,
      pendingStamina: 0,
      damage: 0,
      leader: leader
    };
  }

  function reset() {
    game = {
      duel: 0,
      firstSeat: 0,
      busy: false,
      result: null,
      message: battleDifficulty === "novice" ? "The coach leaves a lane open." : battleDifficulty === "veteran" ? "The house reads your opening." : "The banners are raised.",
      secondWindReady: true,
      sentinelCharges: 3,
      sides: [
        side(playerOrder, playerLeader),
        side(enemyOrder, "sentinel")
      ]
    };
    drawToTwo(game.sides[0]);
    drawToTwo(game.sides[1]);
    render();
  }

  function drawToTwo(s) {
    if (s.active) return;
    while (s.hand.length < 2 && s.deck.length) {
      s.hand.push(s.deck.shift());
    }
  }

  function liveUnits(s) {
    return s.deck.length + s.hand.length + (s.active ? 1 : 0);
  }

  function leaves(count) {
    return count <= 0 ? 1 : Math.max(1, Math.min(6, Math.ceil(count / 5)));
  }

  function deckMarkup(s, whose) {
    var count = s.deck.length;
    var html = '<div class="cc-deck" aria-label="' + count + ' cards in ' + whose + ' draw pile">';
    for (var i = 0; i < leaves(count); i += 1) {
      html += '<i class="cc-leaf" style="--i:' + i + '" aria-hidden="true"></i>';
    }
    html += '<span class="cc-count">' + count + '</span></div>';
    return html;
  }

  function discardMarkup(s, whose) {
    var count = s.discard.length;
    var shown = count ? Math.min(3, count) : 1;
    var html = '<div class="cc-discard' + (count ? '' : ' cc-empty-discard') + '" aria-label="' + count + ' cards in ' + whose + ' discard pile">';
    for (var i = 0; i < shown; i += 1) {
      html += '<i class="cc-discard-leaf" style="--i:' + i + '" aria-hidden="true"></i>';
    }
    if (count) html += '<span class="cc-count">' + count + '</span>';
    html += '</div>';
    return html;
  }

  function pilesMarkup(s, whose) {
    return '<div class="cc-piles">' + deckMarkup(s, whose) + discardMarkup(s, whose) + '</div>';
  }

  function leaderMarkup(which) {
    var mine = which === "second_wind";
    var spec = leaders[which];
    var spent = mine && !game.secondWindReady;
    var charge = mine ? "" : '<span class="cc-charge">' + game.sentinelCharges + '</span>';
    var info = leaderOpen === which
      ? '<span class="cc-leader-note">' + spec.blurb + '</span>'
      : "";
    return '<button type="button" class="cc-leader' + (spent ? ' cc-spent' : '') + '" data-leader="' + which + '" aria-label="' + spec.name + '. ' + spec.blurb + '">'
      + '<img src="' + spec.art + '" alt="">'
      + '<span class="cc-leader-name">' + spec.name + '</span>'
      + '<span class="cc-leader-help" aria-hidden="true">?</span>'
      + charge
      + '</button>' + info;
  }

  function stageCard(u) {
    return '<div class="cc-stage-card" aria-label="' + u.name + ', ' + u.power + ' power, ' + Math.max(0, u.stamina) + ' stamina">'
      + '<img src="' + art[u.name] + '" alt="">'
      + '<span class="cc-stage-shelf"><span>' + u.name + '</span><span class="cc-stage-stats">' + u.power + ' · ' + Math.max(0, u.stamina) + '</span></span>'
      + '</div>';
  }

  function stageMarkup(s, mine) {
    if (s.active) return '<div class="cc-stage">' + stageCard(s.active) + '</div>';
    if (!mine && !game.result) {
      return '<div class="cc-stage"><div class="cc-card-back" aria-label="Face-down opponent card"></div></div>';
    }
    if (mine && !game.busy && !game.result) {
      return '<div class="cc-stage"><div class="cc-drop cc-ready" id="cc-drop" role="group" aria-label="Open field position"></div></div>';
    }
    return '<div class="cc-stage"><div class="cc-drop" aria-label="Open field position"></div></div>';
  }

  function renderSeat(index) {
    var s = game.sides[index];
    var mine = index === 0;
    var leader = leaderMarkup(s.leader);
    var stage = stageMarkup(s, mine);
    var piles = pilesMarkup(s, mine ? "your" : "their");
    var html = mine ? leader + stage + piles : piles + stage + leader;
    var node = document.getElementById(mine ? "cc-you-seat" : "cc-them-seat");
    node.innerHTML = html;
  }

  function renderTug() {
    var mine = liveUnits(game.sides[0]);
    var theirs = liveUnits(game.sides[1]);
    var total = mine + theirs;
    var share = total ? mine / total * 100 : 50;
    var tug = document.getElementById("cc-tug");
    tug.setAttribute("aria-valuemin", "0");
    tug.setAttribute("aria-valuemax", String(Math.max(1, total)));
    tug.setAttribute("aria-valuenow", String(mine));
    tug.setAttribute("aria-valuetext", "You have " + mine + " units. Opponent has " + theirs + " units.");
    tug.innerHTML =
      '<strong class="cc-score">' + mine + '</strong>'
      + '<span class="cc-track" aria-hidden="true">'
      + '<i class="cc-fill-you" style="width:' + share + '%"></i>'
      + '<i class="cc-fill-them" style="width:' + (100 - share) + '%"></i>'
      + '<b class="cc-knot" style="left:' + share + '%"></b>'
      + '</span>'
      + '<strong class="cc-score cc-opponent">' + theirs + '</strong>';
  }

  function handOptions() {
    var hand = game.sides[0].hand;
    if (hand.length === 2 && hand[0].name === hand[1].name
        && hand[0].power === hand[1].power
        && hand[0].stamina === hand[1].stamina) {
      return [{ card: hand[0], index: 0 }];
    }
    return hand.map(function (card, index) {
      return { card: card, index: index };
    });
  }

  function conditionLine(card) {
    if (card.ability === "vanguard" && game.sides[0].firstUnit) {
      return '<span class="cc-condition">+2 power on entry — unless they field one too</span>';
    }
    if (card.ability === "warcry" && game.sides[0].discard.length >= 5) {
      var stacks = Math.floor(game.sides[0].discard.length / 5);
      return '<span class="cc-condition">+' + stacks + '/+' + stacks + ' on entry</span>';
    }
    return "";
  }

  function handCard(item) {
    var card = item.card;
    var spec = catalog[card.name];
    var keyword = spec.ability
      ? '<span class="cc-keyword">' + abilityName[spec.ability] + '</span>'
      : "";
    return '<button type="button" class="cc-unit-card" data-hand-index="' + item.index + '" aria-label="' + card.name + '. ' + card.power + ' power, ' + Math.max(0, card.stamina) + ' stamina. ' + spec.text + '">'
      + '<img class="cc-card-art" src="' + art[card.name] + '" alt="">'
      + '<span class="cc-card-nameplate"><span class="cc-card-name">' + card.name + '</span>'
      + '<span class="cc-card-pips"><span class="cc-pip">' + card.power + '</span><span aria-hidden="true">·</span><span class="cc-pip cc-stamina">' + Math.max(0, card.stamina) + '</span></span></span>'
      + '<span class="cc-card-rules">' + keyword + spec.text + conditionLine(card) + '</span>'
      + '</button>';
  }

  function renderHand() {
    var hand = document.getElementById("cc-hand");
    if (game.result) {
      if (window.parent !== window) window.parent.postMessage({ type: "cc-battle-result", result: game.result }, "*");
      hand.innerHTML = '<div class="cc-result"><strong>' + game.result + '</strong><button type="button" class="btn btn-primary" id="cc-again">Battle again</button></div>';
      document.getElementById("cc-again").addEventListener("click", reset);
      return;
    }
    if (game.busy || game.sides[0].active) {
      hand.innerHTML = "";
      return;
    }
    var options = handOptions();
    hand.innerHTML = options.map(handCard).join("");
    Array.prototype.forEach.call(hand.querySelectorAll(".cc-unit-card"), function (button) {
      var index = Number(button.getAttribute("data-hand-index"));
      bindCard(button, index);
    });
  }

  function bindCard(button, index) {
    var startX = 0;
    var startY = 0;
    var dragging = false;
    var suppressClick = false;

    function overTarget(event) {
      var target = document.getElementById("cc-drop");
      if (!target) return false;
      var rect = target.getBoundingClientRect();
      return event.clientX >= rect.left && event.clientX <= rect.right
        && event.clientY >= rect.top && event.clientY <= rect.bottom;
    }

    function move(event) {
      var dx = event.clientX - startX;
      var dy = event.clientY - startY;
      if (!dragging && Math.hypot(dx, dy) < 7) return;
      dragging = true;
      button.classList.add("cc-dragging");
      button.style.transform = "translate3d(" + dx + "px," + dy + "px,0) scale(1.035)";
      var target = document.getElementById("cc-drop");
      if (target) target.classList.toggle("cc-drag-over", overTarget(event));
    }

    function end(event) {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", end);
      window.removeEventListener("pointercancel", cancel);
      var accepted = dragging && overTarget(event);
      if (dragging) suppressClick = true;
      button.classList.remove("cc-dragging");
      button.classList.remove("cc-hover");
      button.style.removeProperty("transform");
      var target = document.getElementById("cc-drop");
      if (target) target.classList.remove("cc-drag-over");
      if (accepted) commit(index);
    }

    function cancel() {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", end);
      window.removeEventListener("pointercancel", cancel);
      button.classList.remove("cc-dragging");
      button.classList.remove("cc-hover");
      button.style.removeProperty("transform");
      var target = document.getElementById("cc-drop");
      if (target) target.classList.remove("cc-drag-over");
    }

    button.addEventListener("pointerdown", function (event) {
      if (event.pointerType === "mouse" && event.button !== 0) return;
      startX = event.clientX;
      startY = event.clientY;
      dragging = false;
      if (button.setPointerCapture) {
        try {
          button.setPointerCapture(event.pointerId);
        } catch (error) {
          void error;
        }
      }
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", end);
      window.addEventListener("pointercancel", cancel);
    });

    button.addEventListener("pointerenter", function () {
      button.classList.add("cc-hover");
    });
    button.addEventListener("pointerleave", function () {
      if (!dragging) button.classList.remove("cc-hover");
    });
    button.addEventListener("focus", function () {
      button.classList.add("cc-hover");
    });
    button.addEventListener("blur", function () {
      button.classList.remove("cc-hover");
    });

    button.addEventListener("click", function () {
      if (suppressClick) {
        suppressClick = false;
        return;
      }
      commit(index);
    });
  }

  function render() {
    renderSeat(1);
    renderTug();
    renderSeat(0);
    document.getElementById("cc-log").textContent = game.message;
    renderHand();
    Array.prototype.forEach.call(root.querySelectorAll("[data-leader]"), function (button) {
      button.addEventListener("click", function () {
        var id = button.getAttribute("data-leader");
        leaderOpen = leaderOpen === id ? null : id;
        render();
      });
    });
  }

  function chooseEnemy(blind) {
    var foe = game.sides[1];
    drawToTwo(foe);
    if (!foe.hand.length) return;
    var best = 0;
    var bestScore = -Infinity;
    foe.hand.forEach(function (candidate, index) {
      var score = candidate.basePower + candidate.baseStamina;
      if (!blind && game.sides[0].active) {
        score = matchupScore(candidate, game.sides[0].active);
      }
      if (score > bestScore) {
        bestScore = score;
        best = index;
      }
    });
    foe.active = foe.hand.splice(best, 1)[0];
    foe.active.fresh = true;
    applyPending(foe);
  }

  function matchupScore(me, them) {
    var firstStrike = has(me, "ambush") && !has(them, "ambush");
    var kills = me.power >= them.stamina;
    var survives = firstStrike && kills
      ? true
      : me.stamina > them.power || has(me, "guardian") || has(me, "resolve");
    if (kills && survives) return 100 + me.stamina * 2 - (me.basePower + me.baseStamina);
    if (kills) return 10 - (me.basePower + me.baseStamina);
    return -50 + me.power * 2 - (me.basePower + me.baseStamina);
  }

  function applyPending(s) {
    if (!s.active) return;
    s.active.power += s.pendingPower;
    s.active.stamina += s.pendingStamina;
    s.pendingPower = 0;
    s.pendingStamina = 0;
  }

  function fieldPlayer(index) {
    var mine = game.sides[0];
    if (index < 0 || index >= mine.hand.length) return false;
    mine.active = mine.hand.splice(index, 1)[0];
    mine.active.fresh = true;
    applyPending(mine);
    return true;
  }

  function commit(index) {
    if (game.busy || game.result || game.sides[0].active) return;
    game.busy = true;
    if (!fieldPlayer(index)) {
      game.busy = false;
      return;
    }
    if (!game.sides[1].active) chooseEnemy(true);
    maybeSentinelWithdraw();
    game.message = game.sides[0].active.name + " takes the field.";
    render();
    window.setTimeout(resolveDuel, 520);
  }

  function maybeSentinelWithdraw() {
    var foe = game.sides[1];
    var mine = game.sides[0];
    if (!foe.active || !mine.active || foe.active.fresh || !foe.hand.length
        || game.sentinelCharges <= 0) return;
    var current = matchupScore(foe.active, mine.active);
    var best = 0;
    var bestScore = matchupScore(foe.hand[0], mine.active);
    for (var i = 1; i < foe.hand.length; i += 1) {
      var score = matchupScore(foe.hand[i], mine.active);
      if (score > bestScore) {
        bestScore = score;
        best = i;
      }
    }
    if (bestScore <= current) return;
    var old = foe.active;
    foe.active = foe.hand.splice(best, 1)[0];
    foe.hand.push(old);
    foe.active.fresh = true;
    applyPending(foe);
    game.sentinelCharges -= 1;
    game.message = "Sentinel turns the line.";
  }

  function has(u, ability) {
    return Boolean(u)
      && ((u.ability === ability && !u.spent)
        || (u.stolen === ability && !u.stolenSpent));
  }

  function spend(u, ability) {
    if (u.ability === ability && !u.spent) {
      u.spent = true;
      return;
    }
    if (u.stolen === ability && !u.stolenSpent) u.stolenSpent = true;
  }

  function strip(u) {
    u.ability = null;
    u.stolen = null;
    u.spent = true;
    u.stolenSpent = true;
  }

  function firstLiveAbility(u) {
    if (u.ability && !u.spent) return u.ability;
    if (u.stolen && !u.stolenSpent) return u.stolen;
    return null;
  }

  function applyEntry(index) {
    var s = game.sides[index];
    var u = s.active;
    var other = game.sides[1 - index].active;
    if (!u || !u.fresh) return;
    if (has(u, "vanguard") && s.firstUnit) {
      u.power += 2;
      spend(u, "vanguard");
    } else if (has(u, "warcry")) {
      var stacks = Math.floor(s.discard.length / 5);
      u.power += stacks;
      u.stamina += stacks;
      spend(u, "warcry");
    } else if (has(u, "steal") && other) {
      var taken = firstLiveAbility(other);
      if (taken) {
        spend(other, taken);
        u.stolen = taken;
        u.stolenSpent = false;
      }
      spend(u, "steal");
    }
    s.firstUnit = false;
    u.fresh = false;
  }

  function entryPhase() {
    var a = game.sides[0].active;
    var b = game.sides[1].active;
    var entries = ["ambush", "steal", "warcry", "vanguard"];
    var mirror = a && b && a.fresh && b.fresh
      && a.ability && a.ability === b.ability
      && !a.spent && !b.spent && entries.indexOf(a.ability) >= 0;
    if (mirror) {
      a.fresh = false;
      b.fresh = false;
      game.message = "Both " + abilityName[a.ability] + " entries cancel.";
      return;
    }
    applyEntry(game.firstSeat);
    applyEntry(1 - game.firstSeat);
  }

  function resolveDuel() {
    if (!game.sides[0].active || !game.sides[1].active || game.result) return;
    entryPhase();
    var mine = game.sides[0].active;
    var foe = game.sides[1].active;
    var notes = [];
    var rounds = 0;
    var dead = [false, false];

    while (rounds < 64) {
      rounds += 1;
      var mineBefore = mine.stamina;
      var foeBefore = foe.stamina;
      var mineAmbush = has(mine, "ambush") && !has(foe, "ambush");
      var foeAmbush = has(foe, "ambush") && !has(mine, "ambush");

      if (mineAmbush) {
        foe.stamina -= mine.power;
        spend(mine, "ambush");
        if (foe.stamina > 0) mine.stamina -= foe.power;
      } else if (foeAmbush) {
        mine.stamina -= foe.power;
        spend(foe, "ambush");
        if (mine.stamina > 0) foe.stamina -= mine.power;
      } else {
        mine.stamina -= foe.power;
        foe.stamina -= mine.power;
      }

      game.sides[0].damage += Math.max(0, foeBefore - foe.stamina);
      game.sides[1].damage += Math.max(0, mineBefore - mine.stamina);
      dead = [mine.stamina <= 0, foe.stamina <= 0];

      if (dead[0] || dead[1]) {
        var order = [game.firstSeat, 1 - game.firstSeat];
        order.forEach(function (seatIndex) {
          if (!dead[seatIndex]) return;
          var unitHere = seatIndex === 0 ? mine : foe;
          if (has(unitHere, "guardian")) {
            spend(unitHere, "guardian");
            unitHere.stamina = 1;
            dead[seatIndex] = false;
            notes.push(abilityName.guardian + " holds.");
          } else if (dead[1 - seatIndex] && has(unitHere, "resolve")) {
            spend(unitHere, "resolve");
            unitHere.stamina = 1;
            dead[seatIndex] = false;
            notes.push(abilityName.resolve + " holds.");
          } else if (seatIndex === 0 && game.secondWindReady) {
            game.secondWindReady = false;
            unitHere.stamina = 1;
            strip(unitHere);
            dead[seatIndex] = false;
            notes.push("Second Wind catches " + unitHere.name + " at 1.");
          }
        });
        if (dead[0] || dead[1]) break;
      }
    }

    var fallen = [];
    if (dead[0]) fallen.push(discardUnit(0));
    if (dead[1]) fallen.push(discardUnit(1));

    var survivingSeat = dead[0] && !dead[1] ? 1 : dead[1] && !dead[0] ? 0 : -1;
    if (survivingSeat >= 0) {
      var survivor = game.sides[survivingSeat].active;
      if (survivor && has(survivor, "rallier")) {
        spend(survivor, "rallier");
        game.sides[survivingSeat].pendingStamina += 1;
      }
    }

    game.duel += 1;
    game.firstSeat = 1 - game.firstSeat;
    var message = notes.length ? notes[notes.length - 1] : "";
    if (!message) {
      if (fallen.length === 2) message = fallen[0] + " and " + fallen[1] + " fall.";
      else if (fallen.length === 1) message = fallen[0] + " falls.";
      else message = "Neither line gives way.";
    }
    game.message = message;
    root.querySelector(".cc-board").classList.add("cc-clash");
    window.setTimeout(function () {
      var board = root.querySelector(".cc-board");
      if (board) board.classList.remove("cc-clash");
    }, 300);

    checkVictory();
    if (game.result) {
      game.busy = false;
      render();
      return;
    }

    if (!game.sides[0].active) drawToTwo(game.sides[0]);
    if (!game.sides[1].active) drawToTwo(game.sides[1]);
    render();

    if (game.sides[0].active && !game.sides[1].active) {
      game.busy = true;
      window.setTimeout(fieldNextEnemy, 900);
    } else if (!game.sides[0].active) {
      game.busy = false;
      render();
    } else {
      game.busy = true;
      window.setTimeout(resolveDuel, 700);
    }
  }

  function discardUnit(index) {
    var s = game.sides[index];
    var fallen = s.active;
    if (!fallen) return "Unit";
    if (has(fallen, "martyr")) {
      spend(fallen, "martyr");
      s.pendingPower += 2;
    }
    s.discard.push(fallen);
    s.active = null;
    if (index === 1) game.sentinelCharges = Math.min(4, game.sentinelCharges + 1);
    return fallen.name;
  }

  function fieldNextEnemy() {
    if (game.result || !game.sides[0].active || game.sides[1].active) return;
    chooseEnemy(false);
    game.message = game.sides[1].active
      ? game.sides[1].active.name + " turns over."
      : "Their line is empty.";
    render();
    window.setTimeout(resolveDuel, 520);
  }

  function checkVictory() {
    var mine = liveUnits(game.sides[0]);
    var theirs = liveUnits(game.sides[1]);
    if (mine > 0 && theirs > 0) return;
    if (mine > theirs) game.result = "Victory";
    else if (theirs > mine) game.result = "Defeat";
    else if (game.sides[0].discard.length < game.sides[1].discard.length) game.result = "Victory";
    else if (game.sides[1].discard.length < game.sides[0].discard.length) game.result = "Defeat";
    else if (game.sides[0].damage > game.sides[1].damage) game.result = "Victory";
    else if (game.sides[1].damage > game.sides[0].damage) game.result = "Defeat";
    else game.result = "Draw";
  }

  window.addEventListener("message", function (event) {
    if (!event.data || event.data.type !== "cc-configure-battle") return;
    var incoming = Array.isArray(event.data.deck) ? event.data.deck.filter(function (name) {
      return Object.prototype.hasOwnProperty.call(catalog, name);
    }) : [];
    if (incoming.length) playerOrder = incoming.slice(0, 30);
    if (typeof event.data.leader === "string" && event.data.leader !== "") playerLeader = event.data.leader;
    if (event.data.difficulty === "novice" || event.data.difficulty === "steady" || event.data.difficulty === "veteran") battleDifficulty = event.data.difficulty;
    reset();
  });
  reset();
  var exitButton = document.getElementById("cc-exit-battle");
  if (exitButton) exitButton.addEventListener("click", function () {
    if (window.parent !== window) window.parent.postMessage({ type: "cc-exit-battle" }, "*");
    else if (location.protocol === "file:") history.back();
    else location.href = "/?mockup=1";
  });
})();
</script>
